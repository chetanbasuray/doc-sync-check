<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>doc-sync-check</title>
  <style>
    :root { --bg:#f4f8ff; --fg:#0d1b2a; --accent:#0ea5e9; --card:#ffffff; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system; background: radial-gradient(circle at top left,#dbeafe,var(--bg)); color:var(--fg); }
    main { max-width:900px; margin:48px auto; padding:24px; }
    .hero { background:var(--card); border-radius:18px; padding:28px; box-shadow:0 20px 40px rgba(0,0,0,.08); }
    h1 { margin:0 0 8px; font-size:40px; }
    p { line-height:1.6; }
    .cta { display:inline-block; margin-top:12px; padding:10px 16px; border-radius:10px; background:var(--accent); color:white; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>doc-sync-check</h1>
      <p>Keep code signatures and docs in sync with drift detection, coverage reports, caching, and CI-ready integrations.</p>
      <a class="cta" href="https://github.com/chetanbasuray/doc-sync-check">View on GitHub</a>
    </section>
  </main>
</body>
</html>
